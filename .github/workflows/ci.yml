name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: router-reboot-skill
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20]
        include:
          - os: ubuntu-latest
            node: 24
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: router-reboot-skill/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Check scripts parse
        shell: bash
        run: |
          for file in scripts/*.mjs scripts/lib/*.mjs test/*.mjs; do
            node --check "$file"
          done
